<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" role="img">
  <title>play-store-pipeline — how it works</title>
  <desc>A terminal user or an AI agent drives play-api.ts, which performs every change inside one Play edit — open, apply, validate, commit — and moves an app bundle across internal, alpha and production tracks.</desc>
  <style>
    .t1 { font: 600 26px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #e6edf3; }
    .t2 { font: 400 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #9aa7b4; }
    .ct { font: 600 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #e6edf3; }
    .cs { font: 400 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #5b6672; letter-spacing: 1.5px; }
    .cd { font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #9aa7b4; }
    .mono { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #34a853; }
    .chip { font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif; fill: #9aa7b4; }
    .chipm { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9aa7b4; }
    .card { fill: #161b22; stroke: #232a33; }
    .wire { stroke: #3a4450; stroke-width: 2; fill: none; }
    .flow { stroke: #34a853; stroke-width: 2; fill: none; stroke-dasharray: 3 9; animation: dashmove 1.8s linear infinite; }
    .bad  { stroke: #f85149; stroke-width: 2; fill: none; }
    @keyframes dashmove { to { stroke-dashoffset: -24; } }
    .stage { opacity: 0; animation: reveal .5s cubic-bezier(0.2, 0, 0, 1) both; }
    @keyframes reveal { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .s1 { animation-delay: .05s; } .s2 { animation-delay: .15s; } .s3 { animation-delay: .25s; }
    .s4 { animation-delay: .35s; } .s5 { animation-delay: .45s; }
    /* the AAB pill: internal -> alpha -> production */
    .pill { animation: pill 10s cubic-bezier(0.2, 0, 0, 1) 1s infinite; }
    @keyframes pill {
      0%   { transform: translate(0px, 0px); }
      12%  { transform: translate(0px, 0px); }
      30%  { transform: translate(0px, 72px); }
      38%  { transform: translate(0px, 72px); }
      56%  { transform: translate(0px, 144px); }
      92%  { transform: translate(0px, 144px); }
      100% { transform: translate(0px, 144px); }
    }
    .rollbar { transform: scaleX(0); transform-box: fill-box; transform-origin: left center;
               animation: roll 10s cubic-bezier(0.2, 0, 0, 1) 1s infinite; }
    @keyframes roll {
      0%, 56%  { transform: scaleX(0); }
      62%      { transform: scaleX(0.1); }
      72%      { transform: scaleX(0.1); }   /* hold at 10% — staged rollout */
      88%      { transform: scaleX(1); }
      96%      { transform: scaleX(1); }
      100%     { transform: scaleX(0); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x="8" y="8" width="1184" height="604" rx="20" fill="#0e1116" stroke="#232a33"/>

  <text class="t1" x="48" y="56">Play Store Pipeline</text>
  <text class="t2" x="48" y="82">Google Play Console without a browser.</text>

  <!-- left: callers -->
  <g class="stage s1">
    <rect class="card" x="48" y="180" width="190" height="64" rx="10"/>
    <text class="ct" x="143" y="208" text-anchor="middle">You</text>
    <text class="cd" x="143" y="230" text-anchor="middle">terminal</text>
    <rect class="card" x="48" y="264" width="190" height="64" rx="10"/>
    <text class="ct" x="143" y="292" text-anchor="middle">AI agent</text>
    <text class="cd" x="143" y="314" text-anchor="middle">SKILL.md</text>
    <path class="wire" d="M 238 212 C 262 212 262 276 290 276"/>
    <path class="wire" d="M 238 296 L 290 296"/>
    <path class="flow" d="M 238 212 C 262 212 262 276 290 276"/>
    <path class="flow" d="M 238 296 L 290 296"/>
  </g>
  <g class="stage s2">
    <rect x="290" y="232" width="140" height="88" rx="10" fill="#1c232c" stroke="#34a853" stroke-opacity="0.5"/>
    <text class="mono" x="360" y="272" text-anchor="middle">play-api.ts</text>
    <text class="cd" x="360" y="296" text-anchor="middle">one call = one edit</text>
  </g>

  <!-- middle: edit lifecycle -->
  <g class="stage s3">
    <text class="cs" x="452" y="140">ONE EDIT PER RUN</text>
    <rect class="card" x="440" y="152" width="96" height="52" rx="10"/>
    <text class="cd" x="488" y="184" text-anchor="middle" fill="#e6edf3">open edit</text>
    <text class="cd" x="542" y="184">→</text>
    <rect class="card" x="556" y="152" width="90" height="52" rx="10"/>
    <text class="cd" x="601" y="184" text-anchor="middle" fill="#e6edf3">apply</text>
    <text class="cd" x="652" y="184">→</text>
    <rect class="card" x="666" y="152" width="100" height="52" rx="10"/>
    <text class="cd" x="716" y="184" text-anchor="middle" fill="#e6edf3">validate</text>
    <text class="cd" x="772" y="184">→</text>
    <rect x="786" y="152" width="96" height="52" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text class="cd" x="834" y="184" text-anchor="middle" fill="#3fb950">commit</text>
    <!-- failure branch -->
    <path class="bad" d="M 716 204 L 716 236 L 742 236" stroke-dasharray="4 4"/>
    <rect x="744" y="216" width="200" height="40" rx="8" fill="#161b22" stroke="#f85149" stroke-opacity="0.7"/>
    <text class="cd" x="844" y="241" text-anchor="middle" fill="#f85149">any failure → deleted</text>
    <path class="wire" d="M 430 276 L 440 178"/>
    <path class="flow" d="M 430 276 L 440 178"/>
  </g>

  <!-- command chips under apply -->
  <g class="stage s4">
    <text class="cs" x="452" y="290">APPLY = ANY OF</text>
    <g font-size="13">
      <rect x="440" y="302" width="136" height="30" rx="15" fill="#1c232c" stroke="#232a33"/><text class="chip" x="508" y="322" text-anchor="middle">upload AAB</text>
      <rect x="586" y="302" width="120" height="30" rx="15" fill="#1c232c" stroke="#232a33"/><text class="chip" x="646" y="322" text-anchor="middle">promote</text>
      <rect x="716" y="302" width="146" height="30" rx="15" fill="#1c232c" stroke="#232a33"/><text class="chip" x="789" y="322" text-anchor="middle">staged rollout</text>
      <rect x="440" y="340" width="136" height="30" rx="15" fill="#1c232c" stroke="#232a33"/><text class="chip" x="508" y="360" text-anchor="middle">release notes</text>
      <rect x="586" y="340" width="120" height="30" rx="15" fill="#1c232c" stroke="#232a33"/><text class="chip" x="646" y="360" text-anchor="middle">listing</text>
      <rect x="716" y="340" width="146" height="30" rx="15" fill="#1c232c" stroke="#232a33"/><text class="chip" x="789" y="360" text-anchor="middle">images</text>
      <rect x="440" y="378" width="136" height="30" rx="15" fill="#1c232c" stroke="#232a33"/><text class="chip" x="508" y="398" text-anchor="middle">Data safety</text>
      <rect x="586" y="378" width="120" height="30" rx="15" fill="#1c232c" stroke="#232a33"/><text class="chip" x="646" y="398" text-anchor="middle">reviews</text>
    </g>
  </g>

  <!-- right: tracks -->
  <g class="stage s4">
    <text class="cs" x="952" y="214">GOOGLE PLAY TRACKS</text>
    <line x1="952" y1="248" x2="1152" y2="248" stroke="#3a4450" stroke-width="2"/>
    <line x1="952" y1="320" x2="1152" y2="320" stroke="#3a4450" stroke-width="2"/>
    <line x1="952" y1="392" x2="1152" y2="392" stroke="#3a4450" stroke-width="2"/>
    <path class="flow" d="M 952 248 L 1152 248"/>
    <path class="flow" d="M 952 320 L 1152 320"/>
    <path class="flow" d="M 952 392 L 1152 392"/>
    <text class="cd" x="944" y="252" text-anchor="end">internal</text>
    <text class="cd" x="944" y="324" text-anchor="end">alpha</text>
    <text class="cd" x="944" y="396" text-anchor="end">production</text>
    <!-- moving pill -->
    <g class="pill">
      <rect x="1004" y="233" width="96" height="30" rx="15" fill="#1c232c" stroke="#34a853"/>
      <text class="cd" x="1052" y="253" text-anchor="middle" fill="#e6edf3">AAB vc 27</text>
    </g>
    <!-- staged rollout bar on production lane -->
    <rect x="1004" y="414" width="148" height="14" rx="7" fill="#1c232c" stroke="#3a4450"/>
    <rect class="rollbar" x="1006" y="416" width="144" height="10" rx="5" fill="#34a853"/>
    <text class="cd" x="1136" y="446" text-anchor="end" fill="#5b6672">10% → 100%</text>
  </g>

  <!-- bottom: safety chips -->
  <g class="stage s5">
    <rect x="48" y="516" width="1104" height="64" rx="12" fill="#161b22" stroke="#232a33"/>
    <text class="ct" x="76" y="556">Safety</text>
    <rect x="180" y="532" width="130" height="32" rx="16" fill="#1c232c" stroke="#232a33"/>
    <text class="chipm" x="245" y="553" text-anchor="middle">--dry-run</text>
    <rect x="324" y="532" width="170" height="32" rx="16" fill="#1c232c" stroke="#232a33"/>
    <text class="chipm" x="409" y="553" text-anchor="middle">--validate-only</text>
    <rect x="508" y="532" width="220" height="32" rx="16" fill="#1c232c" stroke="#232a33"/>
    <text class="chipm" x="618" y="553" text-anchor="middle">--confirm-production</text>
    <text class="cd" x="1136" y="556" text-anchor="end" fill="#5b6672">validate before commit · delete on failure</text>
  </g>
</svg>
